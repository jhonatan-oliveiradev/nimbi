name: Generate lockfiles

on:
  pull_request:
    paths:
      - ".github/workflows/lockfiles.yml"

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if (git diff --cached --quiet) {
            Write-Host "Lockfiles already up to date."
            exit 0
          }
          git commit -m "chore: lock Nimbi dependencies"
          git push origin HEAD:${{ github.head_ref }}
